<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tailwind v4 Test</title>
  <link rel="stylesheet" href="output.css">
</head>

<body class="relative">

  <!-- Navbar -->
  <div class="bg-[#F8F8F8] h-24 flex justify-evenly items-center">
    <div class="text-3xl">Dashboard</div>
    <!-- input field -->
    <div class="flex items-center gap-x-1 bg-amber-600 w-lg">
      <input type="search" placeholder="Search..."
        class=" w-md border border-gray-300 rounded-md pl-10 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <div class="relative">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
          class="w-7 h-7 text-gray-600 hover:text-blue-500 cursor-pointer">
          <path fill-rule="evenodd"
            d="M10.5 3a7.5 7.5 0 1 0 4.67 13.37l3.73 3.73a1 1 0 0 0 1.42-1.42l-3.73-3.73A7.5 7.5 0 0 0 10.5 3Zm-5.5 7.5a5.5 5.5 0 1 1 11 0a5.5 5.5 0 0 1-11 0Z"
            clip-rule="evenodd" />
        </svg>
      </div>

    </div>

    <div class="flex gap-4">
      <!-- bell icon -->
      <div class="relative">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
          class="w-7 h-7 text-gray-600 hover:text-blue-500 cursor-pointer">
          <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-14 0v5l-2 2v1h18v-1l-2-2Z" />
        </svg>
      </div>

      <!-- Calendar -->
      <div class="relative">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
          class="w-7 h-7 text-gray-600 hover:text-blue-500 cursor-pointer">
          <path
            d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1.5A2.5 2.5 0 0 1 22 6.5v13A2.5 2.5 0 0 1 19.5 22h-15A2.5 2.5 0 0 1 2 19.5v-13A2.5 2.5 0 0 1 4.5 4H6V3a1 1 0 0 1 1-1Zm12.5 8h-15v9.5c0 .276.224.5.5.5h14c.276 0 .5-.224.5-.5V10ZM6 6H4.5a.5.5 0 0 0-.5.5V8h16V6.5a.5.5 0 0 0-.5-.5H18v1a1 1 0 1 1-2 0V6H8v1a1 1 0 1 1-2 0V6Z" />
        </svg>
      </div>
    </div>
  </div>





  <!-- Main Body Dashboard -->

  <div class="bg-yellow-400 flex justify-between">

    <!-- left -->
    <nav class="w-80 min-h-screen bg-gray-900 text-white">
      <ul class="flex flex-col p-4 gap-2">
        <li>
          <a href="#" class="block rounded px-4 py-2 hover:bg-gray-700">
            Dashboard
          </a>
        </li>
        <li>
          <a href="#" class="block rounded px-4 py-2 hover:bg-gray-700">
            Vital Task
          </a> 
        </li>
        <li>
          <a href="#" class="block rounded px-4 py-2 hover:bg-gray-700">
            My Task
          </a>
        </li>
        <li>
          <a href="#" class="block rounded px-4 py-2 hover:bg-gray-700">
            Task Categories
          </a>
        </li>
        <li>
          <a href="#" class="block rounded px-4 py-2 hover:bg-gray-700">
            Settings
          </a>
        </li>
        <li>
          <a href="#" class="block rounded px-4 py-2 hover:bg-gray-700">
            Help
          </a>
        </li>
      </ul>
    </nav>



    <!-- Right -->
    <div class=" bg-blue-500 min-h-[761px] min-w-[958px] border border-[#A1A3ABA1]">
      <div class=" my-3 min-h-[719px] min-w-[906px] flex">

        <!-- To-do Section -->
        <div class="mx-4 min-w-[466px] min-h-[719px] bg-red-300">
          <div class="flex justify-between">
            <h2>To-do</h2>
            <button type="button" class="js-addTask bg-black px-3 py-1 rounded font-medium
         hover:bg-blue-50 transition text-gray-400">
              <span class="text-pink-400">+</span> Add Task
            </button>

          </div>
          <h3>Date - 20 June </h3>


          <!-- Actual notes section -->
          <div class="flex justify-center bg-fuchsia-400 min-h-[650px] min-w-[402px] mx-[10px] mt-3">
            <!-- nischal main div -->
            <div class=" js-notes-container "> <!--Triel div-->
              <!-- <div > -->
                
              <!-- </div> -->
            </div>
          </div>
        </div>

        <!-- Task Status -->
        <div class="bg-blue-900 min-w-[423px] min-h-[719px] ">

        </div>
      </div>
    </div>
  </div>




  <!-- Add New Task Pop-up -->

  <!-- Main Container -->
  <div class="js-addTaskModal fixed hidden inset-0 bg-black/50 flex items-center justify-center z-50">  <!-- custom-->
    <div class=" w-[918px] h-[708px] p-[20px] bg-white border border-gray-300 rounded-lg">

      <!-- Top Row --> 
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-medium">Add New Task</h2>
        <button type="button"
          class="js-goback text-sm text-gray-600 border border-gray-300 hover:bg-gray-200 transition delay-50 duration-100 ease-in-out hover:-translate-y-1 hover:scale-110 px-4 py-1 rounded-md">
          Go Back
        </button>
      </div>

      <!-- Title -->
      <div class="mb-4">
        <label class="block text-sm mb-1">Title</label>
        <input type="text" class="js-input w-[511px] h-[37px] border border-gray-300 rounded-md px-3 outline-none" />
      </div>
   
      <!-- Date -->
      <div class="mb-4">
        <label class="block text-sm mb-1">Date</label>
        <input type="date" class="w-[511px] h-[37px] border border-gray-300 rounded-md px-3 outline-none" />
      </div>

      <!-- Priority -->
      <div class="mb-4">
        <p class="text-sm mb-2">Priority</p>

        <div class="flex gap-4">
          <label class="flex items-center gap-2 text-gray-500">
            <input type="checkbox" class="accent-gray-400" />
            Extreme
          </label>

          <label class="flex items-center gap-2 text-gray-500">
            <input type="checkbox" class="accent-gray-400" />
            Moderate
          </label>

          <label class="flex items-center gap-2 text-gray-500">
            <input type="checkbox" class="accent-gray-400" />
            Low
          </label>
        </div>
      </div>

      <!-- Task Description -->
      <div>
        <label class="block text-sm mb-1">Task Description</label>
        <textarea
          class="js-textarea w-[511px] h-[205px] border border-gray-300 rounded-md px-3 py-2 text-sm text-gray-700 placeholder-gray-400 resize-none outline-none"
          placeholder="Start writing here"></textarea>
      </div>

      <button type="button"
        class="js-buttonDone bg-orange-600 mt-8 ml-3 hover:bg-sky-400 cursor-pointer w-[90px] h-[34px] font-medium text-white text-[14px] rounded-lg transition delay-50 duration-100 ease-in-out hover:-translate-y-1 hover:scale-110">
        Done
      </button>

    </div>
  </div>


  <script src="script.js" defer></script>
</body>

</html>
