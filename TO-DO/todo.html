<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 10vh;
      background-color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
      color: #e5e7eb;
      box-sizing: border-box;
    }



    .container {
      background-color: #1e293b;
      padding: 30px;
      width: 400px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .notes-container {
      background-color: #1e293b;
      padding: 30px;
      margin-left: 20px;
      min-height: 250px;
      width: 400px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-weight: 500;
      color: #f1f5f9;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      background-color: #020617;
      color: #e5e7eb;
      box-sizing: border-box;
    }

    textarea::placeholder {
      color: #94a3b8;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      background-color: #38bdf8;
      color: #020617;
      font-weight: 600;
    }

    button:hover {
      background-color: #0ea5e9;
    }

    /* use classes for javascript notes instead of id because id can break DOM */
    .ul-style {
      list-style-type: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }



    /* Style the list items to align checkbox and text */
    #ul-style li {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Style the checkbox itself */
    #ul-style li input[type="checkbox"] {
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .li-style {
      padding: 5px;
      background: #020617;
      border-radius: 4px;
      margin-top: 8px;
      word-wrap: break-word;
      transition: all 0.8s ease;
    }

    .li-style-checked {
      text-decoration: line-through;
      opacity: 0.6;
    }
  </style>
</head>

<body>


  <div class="container">
    <h2>Write your note here</h2>
    <form action="http://localhost:3000/notes" method="POST">
      <textarea id="input" name="textarea" placeholder="Start typing..."></textarea>

      <button type="submit" id="done">Done</button>
    </form>
  </div>
  <div class="notes-container">
    <ul id="ul-style"> <!-- li created inside-->

    </ul>

  </div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script.js"></script>

</body>

</html>
